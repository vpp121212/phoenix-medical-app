name: phoenix_medical_app
description: تطبيق مجمع فينكس الطبي - حجز المواعيد والخدمات الطبية
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  provider: ^6.1.1
  http: ^1.2.0
  shared_preferences: ^2.2.2
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.7.20
  cached_network_image: ^3.3.1
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.7
  url_launcher: ^6.2.4
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  intl_phone_number_input: ^2.0.2
  pin_code_fields: ^8.0.1
  table_calendar: ^3.0.9
  fl_chart: ^0.66.2
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
